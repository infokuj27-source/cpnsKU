<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Selamat Datang | CPNS HUB
    </title>

    <link
        rel="stylesheet"
        href="css/intro.css"
    >

</head>


<body>

    <main class="intro-page">


        <!-- FOTO INTRO -->

        <div class="intro-image-container">

            <img
                id="introImage"
                src="assets/img/hero1.jpg"
                alt="CPNS HUB"
            >

        </div>


        <!-- LOADING -->

        <div class="loading-container">

            <div class="loading-spinner"></div>

            <p id="introText">

                Menyiapkan pengalaman belajar terbaik...

            </p>

        </div>


        <!-- TOMBOL MASUK -->
<button id="btnMulai" class="btn-mulai">
    ▶ Mulai
</button>
        <button
            id="btnMasuk"
            class="btn-masuk"
        >

            🚀 Masuk ke CPNS HUB

        </button>


        <!-- AUDIO -->

     <audio
    id="introMusic"
    preload="auto"
>
    <source
        src="assets/audio/intro.mp3"
        type="audio/mpeg"
    >
    </audio>

    </main>


    <script src="js/intro.js"></script>

</body>

</html>
